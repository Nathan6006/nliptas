function tiles(series,dates){
  var box=el("div","tiles");
  PEOPLE.forEach(function(p){
    var rows=series[p.k],n=state.window;
    /* The window you picked, against the same stretch just before it. */
    var a=avgPct(rows),b=n?avgPct(seriesFor(p.k,windowDates(n,shift(todayISO(),-n)))):null;
    var t=el("div","tile");
    var top=el("div","row");
    var d=el("span","dot");d.style.background=p.c;
    top.appendChild(d);top.appendChild(el("span","eyebrow",p.n+" · "+(n?"last "+n+" days":"all time")));
    t.appendChild(top);
    var v=el("div","v",a===null?"—":a+"%");
    v.style.color=a===null?"var(--ink-3)":p.c;
    t.appendChild(v);
    var delta="";
    if(a!==null&&b!==null)delta=(a-b>=0?"↑ +":"↓ ")+(a-b)+" pts vs the "+n+" before";
    else if(a!==null)delta="signal share of rated hours";
    else delta="no hours rated yet";
    t.appendChild(el("div","sub",delta));
    t.appendChild(spark(rows,p.c));
    box.appendChild(t);
  });

  var scored=dates.filter(function(d){
    return PEOPLE.some(function(p){return dayTally(d,p.k).counted>0;});
  });
  var t3=el("div","tile");
  t3.appendChild(el("span","eyebrow","Streak"));
  t3.appendChild((function(){var v=el("div","v",String(streak()));return v;})());
  t3.appendChild(el("div","sub",PEOPLE.length>1?"days in a row you both scored":"days in a row you scored"));
  box.appendChild(t3);

  var t4=el("div","tile");
  var hrs=0;
  dates.forEach(function(d){PEOPLE.forEach(function(p){hrs+=dayTally(d,p.k).s;});});
  t4.appendChild(el("span","eyebrow","Signal hours"));
  t4.appendChild(el("div","v",fmtH(hrs)));
  t4.appendChild(el("div","sub","banked across "+scored.length+" scored day"+(scored.length===1?"":"s")));
  box.appendChild(t4);
  return box;
}

function streak(){
  var d=todayISO(),n=0,guard=0;
  if(!PEOPLE.every(function(p){return dayTally(d,p.k).counted>0;}))d=shift(d,-1);
  while(guard++<400){
    if(PEOPLE.every(function(p){return dayTally(d,p.k).counted>0;})){n++;d=shift(d,-1);}
    else break;
  }
  return n;
}

function svgEl(name,attrs){
  var e=document.createElementNS("http://www.w3.org/2000/svg",name);
  for(var k in attrs)e.setAttribute(k,attrs[k]);
  return e;
}

function spark(rows,color){
  var box=el("div","sparkbox");
  var pts=rows.map(function(r){return r.p;});
  var have=pts.filter(function(v){return v!==null;});
  if(have.length<2)return box;
  var W=160,H=26,n=pts.length;
  var svg=svgEl("svg",{viewBox:"0 0 "+W+" "+H,preserveAspectRatio:"none",role:"presentation"});
  var step=n>1?W/(n-1):W;
  var d="",pen=false;
  pts.forEach(function(v,i){
    if(v===null){pen=false;return;}
    var x=i*step,y=H-2-(v/100)*(H-4);
    d+=(pen?"L":"M")+x.toFixed(1)+" "+y.toFixed(1)+" ";pen=true;
  });
  svg.appendChild(svgEl("path",{d:d.trim(),fill:"none",stroke:color,"stroke-width":"2","stroke-linecap":"round","stroke-linejoin":"round","vector-effect":"non-scaling-stroke"}));
  box.appendChild(svg);
  return box;
}

function tipFor(wrap){
  var tip=el("div","tip");wrap.appendChild(tip);return tip;
}
function placeTip(tip,wrap,x,y){
  var w=wrap.clientWidth,tw=tip.offsetWidth;
  var left=Math.max(4,Math.min(w-tw-4,x-tw/2));
  tip.style.left=left+"px";
  tip.style.top=Math.max(0,y)+"px";
}

/* chart 1: daily signal % */
function pctChart(series,dates){

  PEOPLE.forEach(function(p){

    k.appendChild(s);k.appendChild(el("span",null,p.n));

  });
  card.appendChild(leg);

  var wrap=el("div","chartwrap");
  var W=720,H=250,L=34,R=52,T=12,B=28;
  var iw=W-L-R,ih=H-T-B;
  var n=dates.length;
  var step=n>1?iw/(n-1):0;
  var svg=svgEl("svg",{viewBox:"0 0 "+W+" "+H,role:"img"});
  svg.setAttribute("aria-label","Daily signal share for "+PEOPLE.map(function(p){return p.n;}).join(" and "));

  [0,25,50,75,100].forEach(function(v){
    var y=T+ih-(v/100)*ih;
    svg.appendChild(svgEl("line",{x1:L,x2:L+iw,y1:y,y2:y,stroke:"var(--line)","stroke-width":v===50?"1":"1","stroke-dasharray":v===50?"":"2 4"}));
    var tx=svgEl("text",{x:L-8,y:y+3.5,"text-anchor":"end",fill:"var(--ink-3)","font-size":"10","font-family":"var(--f-mono)"});
    tx.textContent=v+"%";
    svg.appendChild(tx);
  });

  var tickEvery=Math.max(1,Math.ceil(n/9));
  dates.forEach(function(d,i){
    if(i%tickEvery)return;
    var x=L+i*step;
    var tx=svgEl("text",{x:x,y:T+ih+16,"text-anchor":"middle",fill:"var(--ink-3)","font-size":"10","font-family":"var(--f-mono)"});
    tx.textContent=shortDate(d);
    svg.appendChild(tx);
  });

  PEOPLE.forEach(function(p){
    var rows=series[p.k];
    var d="",pen=false,lastPt=null;
    rows.forEach(function(r,i){
      if(r.p===null){pen=false;return;}
      var x=L+i*step,y=T+ih-(r.p/100)*ih;
      d+=(pen?"L":"M")+x.toFixed(1)+" "+y.toFixed(1)+" ";pen=true;lastPt={x:x,y:y,p:r.p};
    });
    if(d)svg.appendChild(svgEl("path",{d:d.trim(),fill:"none",stroke:p.c,"stroke-width":"2","stroke-linecap":"round","stroke-linejoin":"round"}));
    rows.forEach(function(r,i){
      if(r.p===null)return;
      var x=L+i*step,y=T+ih-(r.p/100)*ih;
      svg.appendChild(svgEl("circle",{cx:x,cy:y,r:n>45?2.4:3.4,fill:p.c,stroke:"var(--panel)","stroke-width":"2"}));
    });
    if(lastPt){
      var lab=svgEl("text",{x:lastPt.x+9,y:lastPt.y+4,fill:p.c,"font-size":"11.5","font-weight":"600","font-family":"var(--f-body)"});
      lab.textContent=p.n+" "+lastPt.p+"%";
      svg.appendChild(lab);
    }
  });

  var cross=svgEl("line",{x1:0,x2:0,y1:T,y2:T+ih,stroke:"var(--ink-3)","stroke-width":"1","stroke-dasharray":"3 3",opacity:"0"});
  svg.appendChild(cross);
  var hit=svgEl("rect",{x:L-step/2,y:T,width:iw+step,height:ih,fill:"transparent"});
  svg.appendChild(hit);
  wrap.appendChild(svg);
  var tip=tipFor(wrap);

  function move(ev){
    var r=svg.getBoundingClientRect();

    });

  hit.addEventListener("mousemove",move);
  hit.addEventListener("touchmove",function(ev){if(ev.touches[0])move(ev.touches[0]);},{passive:true});
  hit.addEventListener("mouseleave",function(){tip.style.opacity="0";cross.setAttribute("opacity","0");});

function barsFor(rows,dates){
  var wrap=el("div","chartwrap");
  var W=720,H=104,L=26,R=8,T=6,B=20;
  var iw=W-L-R,ih=H-T-B;
  var n=dates.length;
  var slot=iw/Math.max(1,n);
  var bw=Math.max(3,Math.min(17,slot-3));
  var maxH=HOURS.length;
  var svg=svgEl("svg",{viewBox:"0 0 "+W+" "+H,role:"img"});
  [0,10,20].forEach(function(v){
    var y=T+ih-(v/maxH)*ih;
    svg.appendChild(svgEl("line",{x1:L,x2:L+iw,y1:y,y2:y,stroke:"var(--line)","stroke-width":"1","stroke-dasharray":v?"2 4":""}));
    var tx=svgEl("text",{x:L-7,y:y+3.5,"text-anchor":"end",fill:"var(--ink-3)","font-size":"9.5","font-family":"var(--f-mono)"});
    tx.textContent=v?v:"0";
    svg.appendChild(tx);
  });
  rows.forEach(function(r,i){
    var x=L+i*slot+(slot-bw)/2;
    var y=T+ih;
    [["s","var(--signal)"],["n","var(--noise)"]].forEach(function(seg){
      var v=r.t[seg[0]];
      if(!v)return;
      var h=(v/maxH)*ih;
      y-=h;
      svg.appendChild(svgEl("rect",{x:x,y:y+1,width:bw,height:Math.max(1,h-2),rx:2,fill:seg[1]}));
      y-=0;
    });
  });
  var tickEvery=Math.max(1,Math.ceil(n/9));
  dates.forEach(function(d,i){
    if(i%tickEvery)return;
    var tx=svgEl("text",{x:L+i*slot+slot/2,y:T+ih+14,"text-anchor":"middle",fill:"var(--ink-3)","font-size":"9.5","font-family":"var(--f-mono)"});
    tx.textContent=shortDate(d);
    svg.appendChild(tx);
  });
  var hit=svgEl("rect",{x:L,y:T,width:iw,height:ih,fill:"transparent"});
  svg.appendChild(hit);
  wrap.appendChild(svg);
  var tip=tipFor(wrap);
  function move(ev){
    var rect=svg.getBoundingClientRect();
    var sx=(ev.clientX-rect.left)/rect.width*W;
    var i=Math.floor((sx-L)/slot);
    i=Math.max(0,Math.min(n-1,i));
    var r=rows[i];
    tip.innerHTML="<div class='tk'>"+longDate(dates[i])+"</div>"+
      "<div>signal <b>"+fmtH(r.t.s)+"h</b> · noise <b>"+fmtH(r.t.n)+"h</b></div>"+
      "<div>"+(r.p===null?"not scored":r.p+"% signal · "+ratioText(r.t))+"</div>";
    tip.style.opacity="1";
    placeTip(tip,wrap,(L+i*slot+slot/2)/W*wrap.clientWidth,2);
  }
  hit.addEventListener("mousemove",move);
  hit.addEventListener("touchmove",function(ev){if(ev.touches[0])move(ev.touches[0]);},{passive:true});
  hit.addEventListener("mouseleave",function(){tip.style.opacity="0";});
  return wrap;
}

/* what the signal hours actually went to */
function areasCard(dates){
  var card=el("div","card");
  card.appendChild(el("h3",null,"What the signal went to"));
  card.appendChild(el("div","note","Signal hours by what you labeled them, over this window."));
  var cols=el("div","area-cols");
  PEOPLE.forEach(function(p){
    var tot={},all=0,days={},dets={};
    dates.forEach(function(d){
      var e=getEntry(d,p.k);
      if(!e)return;
      for(var k in e.hours){
        if(e.hours[k]!=="s")continue;
        var a=(e.areas&&e.areas[k])||"";
        tot[a]=(tot[a]||0)+1/PER_HOUR;all+=1/PER_HOUR;
        if(!days[a])days[a]={};days[a][d]=1;
        var nt=e.segs&&e.notes?(e.notes[e.segs[k]]||"").trim():"";
        if(nt){if(!dets[a])dets[a]={};dets[a][nt]=(dets[a][nt]||0)+1/PER_HOUR;}
      }
    });
    var col=el("div","area-col");
    var head=el("div","row");head.style.marginBottom="8px";
    var dot=el("span","dot");dot.style.background=p.c;
    head.appendChild(dot);head.appendChild(el("span","lbl",p.n));
    head.appendChild(el("span","area-tot",fmtH(all)+"h signal"));
    col.appendChild(head);
    var names=Object.keys(tot).sort(function(a,b){
      if(!a!==!b)return a?-1:1;
      return tot[b]-tot[a]||a.localeCompare(b);
    });
    if(!all)col.appendChild(el("div","empty","No signal hours in this window."));
    var top=0;names.forEach(function(n){if(n&&tot[n]>top)top=tot[n];});
    if(!top)top=all;
    names.forEach(function(n){
      var nd=Object.keys(days[n]).length;
      var row=el("div","area-row"+(n?"":" none"));
      row.appendChild(el("span","area-name",n||"Unlabeled"));
      var bar=el("span","area-bar");
      var fillEl=el("i");fillEl.style.width=Math.max(2,Math.min(100,100*tot[n]/top))+"%";
      if(n)fillEl.style.background=p.c;
      bar.appendChild(fillEl);row.appendChild(bar);
      row.appendChild(el("span","area-num",fmtH(tot[n])+"h · "+Math.round(100*tot[n]/all)+"%"));
      row.title=(n||"Unlabeled")+": "+fmtH(tot[n])+"h of signal across "+nd+" day"+(nd===1?"":"s");
      col.appendChild(row);
      /* The details written under this label, biggest first. */
      if(dets[n]){
        var ds=Object.keys(dets[n]).sort(function(x,y){return dets[n][y]-dets[n][x]||x.localeCompare(y);});
        var box=el("div","area-dets");
        ds.slice(0,5).forEach(function(t){
          var dr=el("div","area-det");
          dr.appendChild(el("span",null,t));
          dr.appendChild(el("span","area-num",fmtH(dets[n][t])+"h"));
          dr.title=t+": "+fmtH(dets[n][t])+"h";
          box.appendChild(dr);
        });
        if(ds.length>5)box.appendChild(el("div","area-det more","+ "+(ds.length-5)+" more"));
        col.appendChild(box);
      }
    });
    cols.appendChild(col);
  });
  card.appendChild(cols);
  return card;
}

    i.style.background="#e4efea";
    i.style.background="color-mix(in oklab, var(--signal) "+v+"%, var(--panel-2))";
    sc.appendChild(i);
  });
  sc.appendChild(el("span",null,"100%"));
  wrap.appendChild(sc);
  card.appendChild(wrap);
  return card;
}

/* ---------------- undo / redo ----------------
   Snapshot-based: before the first change in a burst, the signed-in person's
   entries and tasks are saved as they were. Typing coalesces into one step
   per pause; clicks, drags and checks are one step each. Only your own data is
   undoable, since that is all you can edit. */
var undoStack=[],redoStack=[];
var baseSnap=null,baseMe=null,groupTimer=null,undoMuted=false;
var UNDO_MAX=100;

function snapMine(){
  var me=state.me;
  if(!me)return null;
  var es={};
  /* The example days aren't anyone's data; treat them as nothing. */
  for(var id in entries){if(entries[id]&&entries[id].person===me)es[id]=entries[id];}
  return JSON.stringify({me:me,entries:es,tasks:tasks[me]});
}
function resetBase(){if(!groupTimer)baseSnap=snapMine();}
function quietly(fn){undoMuted=true;try{fn();}finally{undoMuted=false;}}
function syncUndoOwner(){
  if(baseMe===state.me)return;
  baseMe=state.me;undoStack=[];redoStack=[];
  if(groupTimer){clearTimeout(groupTimer);groupTimer=null;}
  baseSnap=snapMine();
}
function typingNow(){
  var a=document.activeElement;
  /* A new-task box only changes data on Enter, so each add is its own step. */
  if(a&&/^rem-new-/.test(a.id))return false;
  return !!(a&&(a.tagName==="TEXTAREA"||(a.tagName==="INPUT"&&/^(text|search|)$/.test(a.type))));
}
function closeGroup(){
  if(groupTimer){clearTimeout(groupTimer);groupTimer=null;}
  baseSnap=snapMine();
}
function noteChange(){
  if(undoMuted)return;
  if(groupTimer)clearTimeout(groupTimer);
  else{
    if(baseSnap){undoStack.push(baseSnap);if(undoStack.length>UNDO_MAX)undoStack.shift();}
    redoStack=[];
  }
  groupTimer=setTimeout(closeGroup,typingNow()?900:0);
}

function applySnap(str){
  var o=JSON.parse(str),me=state.me;
  if(o.me!==me)return false;
  quietly(function(){
    for(var id in entries){
      var e=entries[id];
      if(e&&e.person===me&&!o.entries[id]){entries[id]=blank(e.date,me);markDirty(id);}
    }
    for(var k in o.entries){
      if(JSON.stringify(entries[k])!==JSON.stringify(o.entries[k])){entries[k]=o.entries[k];markDirty(k);}
    }
    if(JSON.stringify(tasks[me])!==JSON.stringify(o.tasks)){tasks[me]=o.tasks;markTasksDirty(me);}
  });
  return true;
}

function undo(){
  closeGroup();
  if(!undoStack.length){toast("Nothing to undo");return;}
  var cur=snapMine(),prev=undoStack.pop();
  if(!applySnap(prev)){undoStack=[];redoStack=[];return;}
  redoStack.push(cur);
  baseSnap=snapMine();
  render();
  toast("Undone",redoStack.length?["Redo",redo]:null);
}
function redo(){
  closeGroup();
  if(!redoStack.length){toast("Nothing to redo");return;}
  var cur=snapMine(),next=redoStack.pop();
  if(!applySnap(next)){undoStack=[];redoStack=[];return;}
  undoStack.push(cur);
  baseSnap=snapMine();
  render();
  toast("Redone",["Undo",undo]);
}

var toastEl=null,toastTimer=null;
function toast(msg,action){
  if(!toastEl){toastEl=el("div","toast");toastEl.setAttribute("role","status");document.body.appendChild(toastEl);}
  toastEl.innerHTML="";
  toastEl.appendChild(el("span",null,msg));
  if(action){
    var b=el("button",null,action[0]);
    b.onclick=function(){action[1]();};
    toastEl.appendChild(b);
  }
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){toastEl.classList.remove("show");},2600);
}

document.addEventListener("keydown",function(ev){
  if(!sel||!selDelete||ev.metaKey||ev.ctrlKey||ev.altKey)return;
  var a=document.activeElement;
  if(a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA"))return;
  if(ev.key==="Backspace"||ev.key==="Delete"){ev.preventDefault();selDelete();}
  else if(ev.key==="Escape"){sel=null;selDelete=null;render();}
});
document.addEventListener("pointerdown",function(ev){
  if(!sel||(ev.target.closest&&ev.target.closest(".day-col.edit,.areamenu,.selbar")))return;
  sel=null;selDelete=null;
  Array.prototype.slice.call(document.querySelectorAll(".evt.sel")).forEach(function(b){b.classList.remove("sel");var x=b.querySelector(".del");if(x)x.remove();});
  Array.prototype.slice.call(document.querySelectorAll(".selbar")).forEach(function(b){b.remove();});
},true);

/* A text field keeps its own native undo while it has edits of its own;
   once it is back to what it held on focus, ⌘Z falls through to the app. */
document.addEventListener("focusin",function(ev){
  var t=ev.target;
  if(t&&(t.tagName==="INPUT"||t.tagName==="TEXTAREA"))t.dataset.v0=t.value;
});
document.addEventListener("keydown",function(ev){
  if(!(ev.metaKey||ev.ctrlKey)||ev.altKey)return;
  var k=(ev.key||"").toLowerCase();
  var isUndo=k==="z"&&!ev.shiftKey;
  var isRedo=(k==="z"&&ev.shiftKey)||(k==="y"&&ev.ctrlKey&&!ev.metaKey);
  if(!isUndo&&!isRedo)return;
  if(!state.me)return;
  var a=document.activeElement;
  if(a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA")&&a.value!==a.dataset.v0)return;
  ev.preventDefault();
  if(drag)return;
  closeDueMenu();closeAreaMenu();
  if(a&&a.blur)a.blur();
  if(isUndo)undo();else redo();
});

/* ---------------- go ---------------- */
boot();
})();
</script>
